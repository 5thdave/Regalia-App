{% extends "main/master.html" %}
{% block title %}Regalia | Login{% endblock %}

{% block content %}
<style>
    .login-card { width: min(100% - 2rem, 440px); }
    .login-card h2 { margin-bottom: 1.5rem; text-align: center; }
    .login-card .form-group { margin-bottom: 1.1rem; }
    .login-card .form-group input { min-height: 46px; }
    .login-card form[hidden] { display: none !important; }
    .auth-tabs { margin-bottom: 1.5rem; }
    .auth-tab:focus-visible {
        outline: 2px solid var(--onyx, #111212);
        outline-offset: 2px;
    }
    .login-subtext {
        margin: -1rem 0 1.5rem;
        color: var(--dim-gray, #716969);
        text-align: center;
    }
    .login-card .switch { margin-top: 1.25rem; }
    @media (max-width: 480px) {
        .login-card { padding: 1.5rem 1.25rem; }
        .auth-tab { padding: 0.7rem 0.5rem; }
    }
</style>

<main class="main signupmain">
    <div class="signup-card login-card">
        <h2>Welcome back</h2>
        <p class="login-subtext">Sign in to your Regalia account</p>

        <div class="auth-tabs" role="tablist" aria-label="Choose account type">
            <button type="button" class="auth-tab {% if selected_login_type != 'brand' %}active{% endif %}"
                    id="userTabBtn" role="tab" aria-controls="userLoginForm"
                    aria-selected="{{ 'true' if selected_login_type != 'brand' else 'false' }}"
                    tabindex="{{ '0' if selected_login_type != 'brand' else '-1' }}">
                User
            </button>
            <button type="button" class="auth-tab {% if selected_login_type == 'brand' %}active{% endif %}"
                    id="brandTabBtn" role="tab" aria-controls="brandLoginForm"
                    aria-selected="{{ 'true' if selected_login_type == 'brand' else 'false' }}"
                    tabindex="{{ '0' if selected_login_type == 'brand' else '-1' }}">
                Brand
            </button>
        </div>

        <form id="userLoginForm" action="{{ url_for('main.login') }}" method="POST"
              class="signup-form" role="tabpanel" aria-labelledby="userTabBtn"
              {% if selected_login_type == 'brand' %}hidden{% endif %}>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="login_type" value="user">

            <div class="form-group">
                <label for="user_email">Email</label>
                <input type="email" id="user_email" name="email" placeholder="Email address" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="user_password">Password</label>
                <input type="password" id="user_password" name="password" placeholder="Password" minlength="8" autocomplete="current-password" required>
            </div>

            <button type="submit" class="signup-btn">Sign in</button>
            <p class="switch">New to Regalia? <span><a href="{{ url_for('main.user_signup') }}">Create an account</a></span></p>
        </form>

        <form id="brandLoginForm" action="{{ url_for('main.login') }}" method="POST"
              class="signup-form" role="tabpanel" aria-labelledby="brandTabBtn"
              {% if selected_login_type != 'brand' %}hidden{% endif %}>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="login_type" value="brand">

            <div class="form-group">
                <label for="brand_email">Email</label>
                <input type="email" id="brand_email" name="email" placeholder="Brand email address" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="brand_password">Password</label>
                <input type="password" id="brand_password" name="password" placeholder="Password" minlength="8" autocomplete="current-password" required>
            </div>

            <button type="submit" class="signup-btn">Sign in as a brand</button>
            <p class="switch">New brand? <span><a href="{{ url_for('vendor.register') }}">Register your brand</a></span></p>
        </form>
    </div>
</main>
{% endblock %}

{% block script %}
<script>
    (function () {
        const tabs = [
            { button: document.getElementById("userTabBtn"), form: document.getElementById("userLoginForm"), type: "user" },
            { button: document.getElementById("brandTabBtn"), form: document.getElementById("brandLoginForm"), type: "brand" }
        ];

        function selectTab(selected, focusButton) {
            tabs.forEach(function (tab) {
                const isSelected = tab === selected;
                tab.button.classList.toggle("active", isSelected);
                tab.button.setAttribute("aria-selected", String(isSelected));
                tab.button.tabIndex = isSelected ? 0 : -1;
                tab.form.hidden = !isSelected;
            });
            if (focusButton) selected.button.focus();
        }

        tabs.forEach(function (tab, index) {
            tab.button.addEventListener("click", function () {
                selectTab(tab, false);
            });
            tab.button.addEventListener("keydown", function (event) {
                if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
                    event.preventDefault();
                    const nextIndex = (index + (event.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length;
                    selectTab(tabs[nextIndex], true);
                }
            });
        });

        const params = new URLSearchParams(window.location.search);
        const requestedType = window.location.hash === "#brand" ||
            params.get("type") === "brand" || params.get("role") === "brand"
            ? "brand"
            : window.location.hash === "#user" ||
                params.get("type") === "user" || params.get("role") === "user"
                ? "user"
                : null;
        if (requestedType) {
            selectTab(tabs.find(function (tab) { return tab.type === requestedType; }), false);
        }
    })();
</script>
{% endblock %}
