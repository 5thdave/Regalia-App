{% extends "main/master.html" %}

{% block title %}Regalia | Shop{% endblock %}

{% block content %}
<main class="main shop-page">
    <div id="shopheader">
        <div id="shop">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9l1.5-5h15L21 9"></path>
                <path d="M3 9c0 1.66 1.34 3 3 3s3-1.34 3-3c0 1.66 1.34 3 3 3s3-1.34 3-3c0 1.66 1.34 3 3 3s3-1.34 3-3"></path>
                <path d="M5 12v8h14v-8"></path>
                <path d="M10 20v-4h4v4"></path>
            </svg>
            <span>SHOP</span>
        </div>
        <div id="searcharea">
            <input type="text" id="brand-search" placeholder="Search brands..." aria-label="Search brands">
            <span aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>
        </div>
    </div>

    <section id="branddisplay" aria-label="Brands catalog">
        {% for brand, logo in brands %}
            <div class="branddisplaydiv">
                {% if useronline %}
                    <form method="post" action="{{ url_for('user.toggle_favorite', brand_id=brand.brand_id) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="return_to" value="main.shop">
                        <button type="submit" class="btn-fav-toggle{% if brand.brand_id in favorite_brand_ids %} is-favorite{% endif %}" title="{{ 'Remove from' if brand.brand_id in favorite_brand_ids else 'Add to' }} favorites" aria-label="{{ 'Remove' if brand.brand_id in favorite_brand_ids else 'Add' }} {{ brand.brand_name }} to favorites" aria-pressed="{{ 'true' if brand.brand_id in favorite_brand_ids else 'false' }}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                        </button>
                    </form>
                {% else %}
                    <a class="btn-fav-toggle" href="{{ url_for('main.login') }}" title="Log in to save favorites" aria-label="Log in to add {{ brand.brand_name }} to favorites">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </a>
                {% endif %}
                <a href="{{ url_for('main.shopcollection', brand_id=brand.brand_id) }}" aria-label="Shop {{ brand.brand_name }}">
                    <img src="{{ url_for('static', filename='media/brandlogos/' ~ logo) }}" alt="{{ brand.brand_name }} Logo" title="{{ brand.brand_name }}">
                </a>
            </div>
        {% else %}
            <p style="grid-column: 1/-1; text-align: center; color: var(--dim-gray); padding: 40px 0;">No brands available at the moment.</p>
        {% endfor %}
    </section>
</main>
{% endblock %}
