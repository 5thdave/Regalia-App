{% extends "user/master.html" %}

{% block content %}
<main class="main">
    <div class="ad">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="{{ url_for('static', filename='media/background-video.mp4') }}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="gradient-overlay"></div>
        <a href="{{ url_for('main.shop') }}" class="content">Shop With Us</a>
    </div>
    <section id="shopsample" aria-label="Featured Brands">
        {% for brand, logo in featured_brands %}
            <div class="branddisplaydiv">
                {% if session.get('useronline') %}
                    <form method="post" action="{{ url_for('user.toggle_favorite', brand_id=brand.brand_id) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="return_to" value="user.user_home">
                        <button type="submit" class="btn-fav-toggle{% if brand.brand_id in favorite_brand_ids %} is-favorite{% endif %}" aria-label="{{ 'Remove' if brand.brand_id in favorite_brand_ids else 'Add' }} {{ brand.brand_name }} to favorites" aria-pressed="{{ 'true' if brand.brand_id in favorite_brand_ids else 'false' }}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                        </button>
                    </form>
                {% else %}
                    <a class="btn-fav-toggle" href="{{ url_for('main.login') }}" aria-label="Log in to add {{ brand.brand_name }} to favorites">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </a>
                {% endif %}
                <a href="{{ url_for('main.shopcollection', brand_id=brand.brand_id) }}" aria-label="Shop {{ brand.brand_name }}">
                    <img src="{{ url_for('static', filename='media/brandlogos/' ~ logo) }}" alt="{{ brand.brand_name }} Logo">
                </a>
            </div>
        {% endfor %}
    </section>
</main>
{% endblock %}
